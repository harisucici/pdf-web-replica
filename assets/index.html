<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PDF Web Replica</title><link rel="stylesheet" href="reader.css?v=__BUILD__"></head><body>
<header><div class="brand"><small id="subtitle">PDF WEB REPLICA · 校对中</small><strong id="title">PDF Web Replica</strong></div><div class="actions"><button id="compare" aria-pressed="false" hidden>对照原页</button><button id="textToggle" aria-expanded="false" aria-controls="textPanel">查看文字</button><a href="extracted.txt" download>下载全文 ↓</a></div></header>
<nav class="toolbar" aria-label="阅读工具"><button id="prev" aria-label="上一页">←</button><label for="page">页码</label><input id="page" type="number" min="1" value="1"><span id="total" class="muted"></span><button id="next" aria-label="下一页">→</button><span class="divider"></span><button id="minus" aria-label="缩小">−</button><button id="fit">适合宽度</button><button id="plus" aria-label="放大">＋</button><span class="divider"></span><input class="search" id="find" type="search" placeholder="搜索提取文字" aria-label="搜索提取文字"><button id="search">搜索</button></nav>
<div id="notice" role="status" hidden></div><div id="searchResults" aria-live="polite" hidden></div>
<div class="workspace"><main><div id="paper" role="document" aria-label="PDF 网页文字复刻"></div><p id="caption" aria-live="polite"></p></main><aside id="textPanel" hidden><h2 id="textTitle">提取文字</h2><p>原文按源语言保留。OCR、字体和细小注音仍需对照原件校验。</p><button id="copy">复制本页文字</button><pre id="text"></pre></aside></div>
<footer id="footer">HTML/CSS 排版 · 插图独立呈现 · ← → 翻页</footer>
<script>window.addEventListener('error',function(){var n=document.getElementById('notice');n.hidden=false;n.textContent='页面未能加载，请刷新或检查处理报告。'},true);if('scrollRestoration' in history)history.scrollRestoration='manual';window.PDF_PAGES={};</script>
<script id="pdf-replica-qa" type="application/json">{}</script>
<script src="document.js?v=__BUILD__"></script><script src="text-index.js?v=__BUILD__"></script><script src="reader.js?v=__BUILD__"></script></body></html>
