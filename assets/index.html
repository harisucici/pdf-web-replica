<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Web Replica</title><link rel="stylesheet" href="reader.css?v=__BUILD__"></head><body>
<header><strong id="title">PDF Web Replica</strong><span class="draft">Draft · source verification required</span><nav><button id="prev" aria-label="Previous page">←</button><label>PDF page <input id="page" type="number" min="1" value="1"></label><span id="total"></span><button id="next" aria-label="Next page">→</button><button id="minus" aria-label="Zoom out">−</button><button id="fit">Fit width</button><button id="plus" aria-label="Zoom in">+</button><button id="copy">Copy page text</button><a href="extracted.txt" download>Download text</a><input id="find" type="search" placeholder="Find on this page" aria-label="Find on this page"></nav></header>
<div id="notice" role="status">Loading document…</div><main><div id="paper" role="document" aria-label="Reconstructed PDF page"></div></main><footer id="caption"></footer>
<script>window.addEventListener('error',function(){var n=document.getElementById('notice');n.hidden=false;n.textContent='A resource could not be loaded. Reload this page or check the processing report.'},true);if('scrollRestoration' in history)history.scrollRestoration='manual';window.PDF_PAGES={};</script>
<script src="document.js?v=__BUILD__"></script><script src="reader.js?v=__BUILD__"></script></body></html>
