name: Skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF engine
        run: python -m pip install -r requirements.txt
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q scripts
          node --check assets/reader.js
      - name: Synthetic PDF regression tests
        if: runner.os != 'macOS'
        run: python scripts/selftest.py --out "${{ runner.temp }}/pdf-web-replica-tests"
      - name: Synthetic tests including Apple Vision
        if: runner.os == 'macOS'
        run: python scripts/selftest.py --out "${{ runner.temp }}/pdf-web-replica-tests" --vision
      - name: Build distributable archive
        run: python scripts/package.py --out "${{ runner.temp }}/pdf-web-replica-package"
